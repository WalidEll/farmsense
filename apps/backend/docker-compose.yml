version: '3.9'

services:

  postgres:
    image: postgres:15-alpine
    container_name: farmsense-db
    environment:
      POSTGRES_DB: farmsense
      POSTGRES_USER: farmsense
      POSTGRES_PASSWORD: farmsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: farmsense-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
