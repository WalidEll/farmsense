    # ── Team ────────────────────────────────────────────────────

    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: "Ferme El Baraka"
        description:
          type: string

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string

    TeamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          example: "comptable@example.com"
        role:
          $ref: '#/components/schemas/TeamRole'

    TeamMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userName:
          type: string
        userEmail:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        invitedAt:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time

    # ── Error ───────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions (wrong team role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
